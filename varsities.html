        function renderVarsities() {
            const container = document.getElementById('varsitiesContainer');
            container.innerHTML = fullVarsities.map(v => `
                <div class="bg-white rounded-2xl shadow-lg border border-slate-200 overflow-hidden flex flex-col justify-between hover:shadow-2xl transition">
                    <div>
                        <div class="h-48 overflow-hidden relative">
                            <img src="${v.img}" alt="${v.name}" class="w-full h-full object-cover">
                            <span class="absolute top-3 right-3 bg-emerald-600 text-white text-xs font-bold px-3 py-1 rounded-full shadow">পাবলিক</span>
                        </div>
                        <div class="p-6">
                            <h3 class="font-bold text-xl text-slate-900 mb-1">${v.name}</h3>
                            <p class="text-xs font-semibold text-emerald-600 mb-3">${v.est}</p>
                            <p class="text-slate-600 text-sm leading-relaxed mb-4">${v.history}</p>
                        </div>
                    </div>
                    <div class="p-6 pt-0 space-y-2">
                        <button onclick="openEligibilityModal('${v.name}', '${encodeURIComponent(v.eligibility)}')" class="w-full bg-slate-100 hover:bg-slate-200 text-emerald-800 font-bold py-2.5 rounded-xl border border-emerald-200 transition text-sm cursor-pointer">
                            📋 আবেদন যোগ্যতা দেখুন
                        </button>
                        <a href="index.html#enroll" class="block text-center w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 rounded-xl transition text-sm">
                            🎯 প্রস্তুতি শুরু করুন
                        </a>
                    </div>
                </div>
            `).join('');
        }

        function openEligibilityModal(name, encodedEligibility) {
            document.getElementById('modalTitle').innerHTML = `<i class="fa-solid fa-graduation-cap"></i> ${name}`;
            document.getElementById('modalContent').innerHTML = decodeURIComponent(encodedEligibility);
            document.getElementById('eligibilityModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('eligibilityModal').classList.add('hidden');
        }

        renderVarsities();
    </script>
</body>
</html>
