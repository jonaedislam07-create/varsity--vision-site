            { subject: "সাধারণ জ্ঞান", question: "বিশ্ব স্বাস্থ্য সংস্থার (WHO) সদর দপ্তর কোথায়?", options: ["রোম", "জেনেভা", "লন্ডন", "প্যারিস"], answer: 1 },
            { subject: "সাধারণ জ্ঞান", question: "সার্ক (SAARC) প্রতিষ্ঠিত হয় কোন সালে?", options: ["১৯৮০", "১৯৮৫", "১৯৯০", "১৯৯৫"], answer: 1 },
            { subject: "সাধারণ জ্ঞান", question: "সার্কের প্রথম শীর্ষ সম্মেলন কোথায় অনুষ্ঠিত হয়?", options: ["ঢাকা", "নয়াদিল্লি", "কাঠমান্ডু", "কলম্বো"], answer: 0 },
            { subject: "সাধারণ জ্ঞান", question: "বিশ্বের বৃহত্তম মহাসাগর কোনটি?", options: ["আটলান্টিক মহাসাগর", "ভারত মহাসাগর", "প্রশান্ত মহাসাগর", "উত্তর মহাসাগর"], answer: 2 },
            { subject: "সাধারণ জ্ঞান", question: "বিশ্বের সর্বোচ্চ পর্বতশৃঙ্গ কোনটি?", options: ["K2", "কাঞ্চনজঙ্ঘা", "মাউন্ট এভারেস্ট", "লোৎসে"], answer: 2 },
            { subject: "সাধারণ জ্ঞান", question: "পৃথিবীর বৃহত্তম উষ্ণ মরুভূমি কোনটি?", options: ["গোবি", "সাহারা", "কালাহারি", "আরব মরুভূমি"], answer: 1 },
            { subject: "সাধারণ জ্ঞান", question: "আয়তনে বিশ্বের বৃহত্তম দেশ কোনটি?", options: ["কানাডা", "চীন", "যুক্তরাষ্ট্র", "রাশিয়া"], answer: 3 },
            { subject: "সাধারণ জ্ঞান", question: "জাপানের মুদ্রার নাম কী?", options: ["ইউয়ান", "ইয়েন", "উওন", "বাত"], answer: 1 },
            { subject: "সাধারণ জ্ঞান", question: "ব্রাজিলের সরকারি ভাষা কী?", options: ["স্প্যানিশ", "পর্তুগিজ", "ফরাসি", "ইংরেজি"], answer: 1 },
            { subject: "সাধারণ জ্ঞান", question: "সুয়েজ খাল কোন দুটি জলভাগকে যুক্ত করেছে?", options: ["ভূমধ্যসাগর ও লোহিত সাগর", "কৃষ্ণসাগর ও কাস্পিয়ান সাগর", "আরব সাগর ও বঙ্গোপসাগর", "ভূমধ্যসাগর ও কৃষ্ণসাগর"], answer: 0 },
            { subject: "সাধারণ জ্ঞান", question: "পানির রাসায়নিক সংকেত কোনটি?", options: ["CO2", "H2O", "O2", "NaCl"], answer: 1 },
            { subject: "সাধারণ জ্ঞান", question: "ভিটামিন C-এর অভাবে কোন রোগ হয়?", options: ["রিকেটস", "স্কার্ভি", "বেরিবেরি", "রাতকানা"], answer: 1 },
            { subject: "সাধারণ জ্ঞান", question: "মানবদেহের বৃহত্তম অঙ্গ কোনটি?", options: ["যকৃৎ", "ফুসফুস", "ত্বক", "হৃদ্‌যন্ত্র"], answer: 2 },
            { subject: "সাধারণ জ্ঞান", question: "উদ্ভিদের সালোকসংশ্লেষণ প্রক্রিয়ায় কোন গ্যাস শোষিত হয়?", options: ["অক্সিজেন", "নাইট্রোজেন", "কার্বন ডাই-অক্সাইড", "হাইড্রোজেন"], answer: 2 },
            { subject: "সাধারণ জ্ঞান", question: "কম্পিউটারের CPU-এর পূর্ণরূপ কী?", options: ["Central Processing Unit", "Computer Primary Utility", "Central Program User", "Control Processing Usage"], answer: 0 },
            { subject: "সাধারণ জ্ঞান", question: "ওজোন স্তর বায়ুমণ্ডলের কোন স্তরে অবস্থিত?", options: ["ট্রপোস্ফিয়ার", "স্ট্র্যাটোস্ফিয়ার", "মেসোস্ফিয়ার", "থার্মোস্ফিয়ার"], answer: 1 },
            { subject: "সাধারণ জ্ঞান", question: "নোবেল পুরস্কার প্রথম প্রদান করা হয় কোন সালে?", options: ["১৮৯৫", "১৯০১", "১৯১৪", "১৯২১"], answer: 1 }
        ];

        let quizData = [];
        let currentQuestionIndex = 0;
        let score = 0;
        let answered = false;

        const subjectSelection = document.getElementById("subject-selection");
        const examInterface = document.getElementById("exam-interface");
        const questionTitle = document.getElementById("question-title");
        const optionsContainer = document.getElementById("options-container");
        const questionCounter = document.getElementById("question-counter");
        const feedback = document.getElementById("feedback");
        const nextBtn = document.getElementById("next-btn");
        const examBadge = document.getElementById("exam-badge");

        // শাফেল করার ফাংশন
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function startExam(subjectName) {
            // ওই বিষয়ের প্রশ্নগুলো ফিল্টার করে নেওয়া এবং শাফেল করা
            let filtered = questions.filter(q => q.subject === subjectName);
            quizData = shuffleArray([...filtered]);
            
            currentQuestionIndex = 0;
            score = 0;

            examBadge.textContent = `${subjectName} মডেল টেস্ট`;

            subjectSelection.classList.add("hidden");
            examInterface.classList.remove("hidden");
            loadQuestion();
        }

        function loadQuestion() {
            answered = false;
            feedback.classList.add("hidden");
            nextBtn.classList.add("hidden");

            const currentQ = quizData[currentQuestionIndex];
            questionTitle.textContent = `${currentQuestionIndex + 1}. ${currentQ.question}`;
            questionCounter.textContent = `প্রশ্ন ${currentQuestionIndex + 1} / ${quizData.length}`;

            // অপশনগুলো সাজানোর জন্য অবজেক্ট তৈরি যাতে সঠিক উত্তর ট্র্যাক করা যায়
            let optionsWithIndex = currentQ.options.map((opt, idx) => ({
                text: opt,
                isCorrect: idx === currentQ.answer
            }));

            // অপশনগুলোও শাফেল বা এলোমেলো করা
            shuffleArray(optionsWithIndex);

            optionsContainer.innerHTML = "";
            optionsWithIndex.forEach((optObj) => {
                const btn = document.createElement("button");
                btn.className = "option-btn w-full text-left p-3 rounded-xl border border-gray-200 hover:bg-indigo-50 hover:border-indigo-300 transition font-medium text-gray-700";
                btn.textContent = optObj.text;
                btn.onclick = () => selectAnswer(optObj.isCorrect, btn, optionsWithIndex);
                optionsContainer.appendChild(btn);
            });
        }

        function selectAnswer(isCorrect, selectedBtn, allOptions) {
            if (answered) return;
            answered = true;

            const allButtons = optionsContainer.querySelectorAll("button");
            allButtons.forEach((btn, idx) => {
                btn.disabled = true;
                if (allOptions[idx].isCorrect) {
                    btn.classList.add("bg-green-100", "border-green-500", "text-green-800");
                }
            });

            feedback.classList.remove("hidden");
            if (isCorrect) {
                selectedBtn.classList.add("bg-green-100", "border-green-500", "text-green-800");
                feedback.textContent = "অসাধারণ! আপনার উত্তর সঠিক হয়েছে। 🎉";
                feedback.className = "p-3 rounded-xl text-center font-semibold text-sm mb-4 bg-green-50 text-green-700 border border-green-200";
                score++;
            } else {
                selectedBtn.classList.add("bg-red-100", "border-red-500", "text-red-800");
                feedback.textContent = "দুঃখিত, উত্তরটি ভুল হয়েছে। সঠিক উত্তরটি সবুজ রঙে চিহ্নিত করা হলো।";
                feedback.className = "p-3 rounded-xl text-center font-semibold text-sm mb-4 bg-red-50 text-red-700 border border-red-200";
            }

            nextBtn.classList.remove("hidden");
            if (currentQuestionIndex === quizData.length - 1) {
                nextBtn.textContent = "ফলাফল দেখুন 🏁";
            } else {
                nextBtn.textContent = "পরবর্তী প্রশ্ন ➡️";
            }
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < quizData.length) {
                loadQuestion();
            } else {
                questionTitle.textContent = "অভিনন্দন! আপনার পরীক্ষা শেষ হয়েছে। 🏆";
                optionsContainer.innerHTML = `<div class="text-center py-6 text-xl font-bold text-indigo-700">আপনার মোট স্কোর: ${score} / ${quizData.length}</div>`;
                feedback.classList.add("hidden");
                nextBtn.classList.add("hidden");
            }
        }

        function goBackToSubjects() {
            examInterface.classList.add("hidden");
            subjectSelection.classList.remove("hidden");
        }
    </script>
